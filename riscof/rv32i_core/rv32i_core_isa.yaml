# rv32i_core_isa.yaml - what the core implements, in riscv-config format.
# RISCOF reads this to choose which tests apply: only RV32I here.
hart_ids: [0]
hart0:
  ISA: RV32I                  # base integer ISA only: no M, C, Zicsr, Zifencei
  physical_addr_sz: 32
  User_Spec_Version: '2.3'
  supported_xlen: [32]
  misa:                       # riscv-config insists on describing misa
    reset-val: 0x40000100     # MXL=1 (32-bit), bit 8 = 'I'
    rv32:
      accessible: true        # required by the schema; no RV32I test reads it
      mxl:
        implemented: true
        type:
          warl:
            dependency_fields: []
            legal:
              - mxl[1:0] in [0x1]
            wr_illegal:
              - Unchanged
      extensions:
        implemented: true
        type:
          warl:
            dependency_fields: []
            legal:
              - extensions[25:0] bitmask [0x0000100, 0x0000000]
            wr_illegal:
              - Unchanged
