; config.ini - tells RISCOF which plugins to use and where they are.
; Relative paths are relative to THIS file's folder (riscof/).

[RISCOF]
ReferencePlugin=spike
ReferencePluginPath=spike
DUTPlugin=rv32i_core
DUTPluginPath=rv32i_core

[rv32i_core]
pluginpath=rv32i_core
; for the multiply tests use rv32i_core/rv32im_isa.yaml instead
ispec=rv32i_core/rv32i_core_isa.yaml
pspec=rv32i_core/rv32i_core_platform.yaml
; which core to test: single_cycle or pipelined (uses rtl_<core>.f)
core=single_cycle
; the repository root; the paths in rtl_<core>.f are relative to it
core_root=..
prefix=riscv64-unknown-elf-
jobs=4
timeout=3600
max_cycles=2000000
target_run=1

[spike]
pluginpath=spike
; folder holding the spike binary (leave empty if spike is on PATH)
PATH=~/tools/spike/bin
prefix=riscv64-unknown-elf-
jobs=4
